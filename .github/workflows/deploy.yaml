name: Deploy to Github Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    outputs:
      start_ms: ${{ steps.start.outputs.ms }}

    steps:
      # Start of the deploy window for the Grafana annotation.
      - id: start
        run: echo "ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        env:
          cache-name: cache-hugo-resources
        with:
          path: resources
          key: ${{ env.cache-name }}

      - uses: actions/setup-go@v6
        with:
          go-version: "^1.17.0"
      - run: go version

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        env:
          # Rendered as <meta name="build-sha"> for the smoke test.
          HUGO_BUILD_SHA: ${{ github.sha }}
        run: hugo --minify --gc

      # PRs only build; publishing them would put unmerged changes live.
      - name: Deploy 🚀
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
          single-commit: true

  # After a deploy, wait until the new build is served, then run the HTTPS SM
  # check once from its probes and fail if any of them doesn't see this build.
  smoke:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRAFANA_SERVER: https://markpoko.grafana.net
    steps:
      - uses: actions/checkout@v5

      # Installs gcx, waits for the new build to be served, then runs the
      # check once from its probes. The target is the check's own
      # (https://markpoko.dev). gcx stays on PATH for the steps after this.
      - name: Smoke test with SM probes
        id: smoke
        # feat/smoke-tests; move to a release tag once one is published.
        uses: grafana/synthetic-monitoring-action@ff64b1448aec188b0111d1a156da94bd60eddc91
        with:
          mode: smoke
          grafana-stack-url: ${{ env.GRAFANA_SERVER }}
          sm-token: ${{ secrets.GRAFANA_SM_TOKEN }}
          gcx-version: v1.7.1
          smoke-check-file: sm-checks/blog-103862.yaml
          smoke-cache-bust: ${{ github.sha }}
          smoke-body-regexp: name="?build-sha"? content="?${{ github.sha }}
          smoke-wait-timeout: "600"
          smoke-wait-interval: "15"

      # Grafana Assistant's take on the failure, in the job summary. Never
      # changes the job result. Skipped when the site never became ready: no
      # check ran, so there are no probe logs to read.
      - name: Ask Grafana Assistant
        if: ${{ failure() && steps.smoke.outcome == 'failure' && steps.smoke.outputs.smoke-result != '' }}
        continue-on-error: true
        env:
          ASSISTANT_TOKEN: ${{ secrets.GRAFANA_ASSISTANT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.smoke-result }}
        run: scripts/sm-assistant.sh "$SMOKE_RESULT"

      # Mark the deploy window in Grafana, whether or not the smoke test
      # passed. A failure here shouldn't fail the deploy.
      - name: Annotate deploy in Grafana
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_SM_TOKEN }}
          START_MS: ${{ needs.build.outputs.start_ms }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/grafana-annotate.sh "${GITHUB_SHA}" "$OUTCOME" "$START_MS" "$RUN_URL"
