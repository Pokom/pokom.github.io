name: Deploy to Github Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        env:
          cache-name: cache-hugo-resources
        with:
          path: resources
          key: ${{ env.cache-name }}

      - uses: actions/setup-go@v6
        with:
          go-version: "^1.17.0"
      - run: go version

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        env:
          # Rendered as <meta name="build-sha"> for the smoke test.
          HUGO_BUILD_SHA: ${{ github.sha }}
        run: hugo --minify --gc

      # PRs only build; publishing them would put unmerged changes live.
      - name: Deploy 🚀
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
          single-commit: true

  # After a deploy, wait until the new build is served, then run the HTTPS SM
  # check once from its probes and fail if any of them doesn't see this build.
  smoke:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRAFANA_SERVER: https://markpoko.grafana.net
      # Keep in sync with sm-checks.yaml / sm-drift.yaml.
      GCX_REF: 2a388d08ce7759804c711c3ccd18276d97f626e1
    steps:
      - uses: actions/checkout@v5

      # Installed first so the build overlaps the Pages publish.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install gcx
        run: |
          go install "github.com/grafana/gcx/cmd/gcx@${GCX_REF}"
          gcx --version

      - name: Wait for the new build to be live
        run: scripts/wait-for-build.sh https://markpoko.dev/ "${GITHUB_SHA}" 600 15

      - name: Smoke test with SM probes
        env:
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_SM_TOKEN }}
        run: scripts/sm-smoke.sh sm-checks/blog-103862.yaml https://markpoko.dev/ "${GITHUB_SHA}"
