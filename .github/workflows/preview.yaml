name: PR preview

# Deploys each PR to a Cloudflare Pages branch alias so a change can be checked
# before it merges. The SM smoke test is removed for now because
# grafana/synthetic-monitoring-action is private: an action that can't be
# resolved fails the whole job at "Set up job", before any step runs, so even
# the build and deploy never ran. Production (deploy.yaml) is untouched.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Sticky preview comment on the PR.
  pull-requests: write

# One preview per PR; a new push supersedes the previous run.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CF_PROJECT: markpoko-blog
  PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.markpoko-blog.pages.dev/

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        env:
          HUGO_BUILD_SHA: ${{ github.sha }}
        run: hugo --minify --gc --baseURL "$PREVIEW_URL"

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: pages deploy public --project-name=${{ env.CF_PROJECT }} --branch=${{ env.PREVIEW_BRANCH }}

      # The site was built for PREVIEW_URL; fail loudly if Cloudflare put it
      # somewhere else (e.g. a different branch-alias format).
      - name: Check preview alias
        id: alias
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "deployment: ${{ steps.deploy.outputs.deployment-url }}"
          echo "alias:      ${ALIAS_URL}"
          if [ "${ALIAS_URL%/}/" != "$PREVIEW_URL" ]; then
            echo "::error::alias ${ALIAS_URL} != expected ${PREVIEW_URL}"
            exit 1
          fi
          echo "### Preview: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, edited on every run, pass or fail.
      - name: Comment on PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY: ${{ steps.deploy.outcome }}
          ALIAS: ${{ steps.alias.outcome }}
        run: |
          body="${RUNNER_TEMP}/preview-comment.md"
          {
            echo "<!-- preview-smoke -->"
            echo "## Preview: ${JOB_STATUS}"
            echo
            echo "- URL: ${PREVIEW_URL}"
            echo "- Commit: \`${HEAD_SHA:0:7}\`"
            echo "- Run: ${RUN_URL}"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Deploy | ${DEPLOY:-not run} |"
            echo "| Alias check | ${ALIAS:-not run} |"
          } >"$body"
          scripts/pr-comment.sh "$GITHUB_REPOSITORY" "$PR_NUMBER" "<!-- preview-smoke -->" "$body"
