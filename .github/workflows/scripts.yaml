name: Script tests

# Offline tests for scripts/ (fake gcx, local pages); no secrets needed.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/scripts.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/testdata/fake-gcx/gcx scripts/testdata/fake-gh/gh
      - name: Tests
        run: scripts/test.sh
