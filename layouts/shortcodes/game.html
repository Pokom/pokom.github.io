{{- /*
  Embeds a browser game in a 4:3 frame (matches the game's 320x240 resolution).
  Usage: {{< game src="https://breakout.markpoko.dev/" title="..." >}}
*/ -}}
<div style="max-width: 960px; aspect-ratio: 4 / 3;">
  <iframe
    src="{{ .Get "src" }}"
    title="{{ .Get "title" | default "Game" }}"
    allow="fullscreen; autoplay"
    loading="lazy"
    style="width: 100%; height: 100%; border: 0;"></iframe>
</div>
